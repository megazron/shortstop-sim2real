<?xml version='1.0' encoding='UTF-8'?>
<svg xmlns='http://www.w3.org/2000/svg' width='1180' height='420' viewBox='0 0 1180 420' font-family='Helvetica, Arial, sans-serif'>
<rect width='1180' height='420' fill='white'/>
<defs><marker id='a' markerWidth='10' markerHeight='10' refX='9' refY='5' orient='auto'><path d='M0,0 L10,5 L0,10 z' fill='#1f2933'/></marker></defs>
<rect x='20' y='40' width='190' height='120' rx='8' fill='#f4f7f5' stroke='#0b6e4f' stroke-width='1.6'/>
<text x='115.0' y='64' text-anchor='middle' font-size='15' font-weight='bold' fill='#1f2933'>1. Record runs</text>
<text x='115.0' y='86' text-anchor='middle' font-size='12' fill='#1f2933' font-family='Helvetica, Arial, sans-serif'>command a move, wait,</text>
<text x='115.0' y='103' text-anchor='middle' font-size='12' fill='#1f2933' font-family='Helvetica, Arial, sans-serif'>log q_target / q_achieved,</text>
<text x='115.0' y='120' text-anchor='middle' font-size='12' fill='#1f2933' font-family='Helvetica, Arial, sans-serif'>optional axis label</text>
<text x='115.0' y='137' text-anchor='middle' font-size='12' fill='#1f2933' font-family='Helvetica, Arial, sans-serif'>(both arms separately)</text>
<line x1='210' y1='100' x2='258' y2='100' stroke='#1f2933' stroke-width='1.6' marker-end='url(#a)'/>
<text x='234.0' y='90' text-anchor='middle' font-size='10' fill='#8a94a6'>runs.json</text>
<rect x='260' y='30' width='250' height='140' rx='8' fill='#f4f7f5' stroke='#0b6e4f' stroke-width='1.6'/>
<text x='385.0' y='54' text-anchor='middle' font-size='15' font-weight='bold' fill='#1f2933'>2. sim2real-gap fit</text>
<text x='385.0' y='76' text-anchor='middle' font-size='12' fill='#1f2933' font-family='Helvetica, Arial, sans-serif'>EPS = median |park error|</text>
<text x='385.0' y='93' text-anchor='middle' font-size='12' fill='#1f2933' font-family='Helvetica, Arial, sans-serif'>controls, all must pass:</text>
<text x='385.0' y='110' text-anchor='middle' font-size='12' fill='#1f2933' font-family='Helvetica, Arial, sans-serif'>identity on the table</text>
<text x='385.0' y='127' text-anchor='middle' font-size='12' fill='#1f2933' font-family='Helvetica, Arial, sans-serif'>held out on an unseen AXIS</text>
<text x='385.0' y='144' text-anchor='middle' font-size='12' fill='#1f2933' font-family='Helvetica, Arial, sans-serif'>scrambled signs must fail</text>
<text x='385.0' y='161' text-anchor='middle' font-size='12' fill='#1f2933' font-family='Helvetica, Arial, sans-serif'>noise must degrade it</text>
<line x1='510' y1='100' x2='558' y2='100' stroke='#1f2933' stroke-width='1.6' marker-end='url(#a)'/>
<text x='534.0' y='90' text-anchor='middle' font-size='10' fill='#8a94a6'>model.json</text>
<rect x='560' y='40' width='190' height='120' rx='8' fill='#f4f7f5' stroke='#0b6e4f' stroke-width='1.6'/>
<text x='655.0' y='64' text-anchor='middle' font-size='15' font-weight='bold' fill='#1f2933'>3. TerminalOffsetModel</text>
<text x='655.0' y='86' text-anchor='middle' font-size='12' fill='#1f2933' font-family='Helvetica, Arial, sans-serif'>eps per arm, controls_passed,</text>
<text x='655.0' y='103' text-anchor='middle' font-size='12' fill='#1f2933' font-family='Helvetica, Arial, sans-serif'>not_validated list</text>
<text x='655.0' y='120' text-anchor='middle' font-size='12' fill='#1f2933' font-family='Helvetica, Arial, sans-serif'>refuses unknown arms</text>
<text x='655.0' y='137' text-anchor='middle' font-size='12' fill='#1f2933' font-family='Helvetica, Arial, sans-serif'>refuses failed controls</text>
<line x1='750' y1='100' x2='798' y2='100' stroke='#1f2933' stroke-width='1.6' marker-end='url(#a)'/>
<rect x='800' y='40' width='220' height='120' rx='8' fill='#f4f7f5' stroke='#0b6e4f' stroke-width='1.6'/>
<text x='910.0' y='64' text-anchor='middle' font-size='15' font-weight='bold' fill='#1f2933'>4. correct(q_from, q_to)</text>
<text x='910.0' y='86' text-anchor='middle' font-size='12' fill='#1f2933' font-family='Helvetica, Arial, sans-serif'>overshoot every joint by EPS</text>
<text x='910.0' y='103' text-anchor='middle' font-size='12' fill='#1f2933' font-family='Helvetica, Arial, sans-serif'>in its direction of travel;</text>
<text x='910.0' y='120' text-anchor='middle' font-size='12' fill='#1f2933' font-family='Helvetica, Arial, sans-serif'>wrap continuous joints;</text>
<text x='910.0' y='137' text-anchor='middle' font-size='12' fill='#1f2933' font-family='Helvetica, Arial, sans-serif'>leave a joint that barely moved</text>
<rect x='20' y='250' width='190' height='110' rx='8' fill='#f7f7f7' stroke='#8a94a6' stroke-width='1.6'/>
<text x='115.0' y='274' text-anchor='middle' font-size='15' font-weight='bold' fill='#1f2933'>Simulation / planner</text>
<text x='115.0' y='296' text-anchor='middle' font-size='12' fill='#1f2933' font-family='Helvetica, Arial, sans-serif'>joint setpoint stream</text>
<text x='115.0' y='313' text-anchor='middle' font-size='12' fill='#1f2933' font-family='Helvetica, Arial, sans-serif'>(sim -> real seam)</text>
<line x1='210' y1='305' x2='258' y2='305' stroke='#1f2933' stroke-width='1.6' marker-end='url(#a)'/>
<text x='234.0' y='295' text-anchor='middle' font-size='10' fill='#8a94a6'>q_sim, v_sim</text>
<rect x='260' y='240' width='220' height='130' rx='8' fill='#fdf3ef' stroke='#c8553d' stroke-width='1.6'/>
<text x='370.0' y='264' text-anchor='middle' font-size='15' font-weight='bold' fill='#1f2933'>HomingGate</text>
<text x='370.0' y='286' text-anchor='middle' font-size='12' fill='#1f2933' font-family='Helvetica, Arial, sans-serif'>|wrap(q_sim − q_real)| ≤ 0.05 rad</text>
<text x='370.0' y='303' text-anchor='middle' font-size='12' fill='#1f2933' font-family='Helvetica, Arial, sans-serif'>on every joint, or REFUSE</text>
<text x='370.0' y='320' text-anchor='middle' font-size='12' fill='#1f2933' font-family='Helvetica, Arial, sans-serif'>plan_home(): slow ramp with</text>
<text x='370.0' y='337' text-anchor='middle' font-size='12' fill='#1f2933' font-family='Helvetica, Arial, sans-serif'>velocities filled in</text>
<line x1='480' y1='305' x2='528' y2='305' stroke='#1f2933' stroke-width='1.6' marker-end='url(#a)'/>
<text x='504.0' y='295' text-anchor='middle' font-size='10' fill='#8a94a6'>enabled</text>
<rect x='530' y='230' width='300' height='150' rx='8' fill='#f4f7f5' stroke='#0b6e4f' stroke-width='1.6'/>
<text x='680.0' y='254' text-anchor='middle' font-size='15' font-weight='bold' fill='#1f2933'>VelocityRelay</text>
<text x='680.0' y='276' text-anchor='middle' font-size='12' fill='#1f2933' font-family='Menlo, Consolas, monospace'>speed = clip(v_ff + kp·err, ±vmax)</text>
<text x='680.0' y='293' text-anchor='middle' font-size='12' fill='#1f2933' font-family='Menlo, Consolas, monospace'>clip on SPEED, not on error</text>
<text x='680.0' y='310' text-anchor='middle' font-size='12' fill='#1f2933' font-family='Menlo, Consolas, monospace'>deadband gates the correction only</text>
<text x='680.0' y='327' text-anchor='middle' font-size='12' fill='#1f2933' font-family='Menlo, Consolas, monospace'>watchdog → zero speed</text>
<text x='680.0' y='344' text-anchor='middle' font-size='12' fill='#1f2933' font-family='Menlo, Consolas, monospace'>monotonic clock; achieved rate logged</text>
<line x1='830' y1='305' x2='878' y2='305' stroke='#1f2933' stroke-width='1.6' marker-end='url(#a)'/>
<text x='854.0' y='295' text-anchor='middle' font-size='10' fill='#8a94a6'>joint speeds</text>
<rect x='880' y='250' width='140' height='110' rx='8' fill='#f7f7f7' stroke='#8a94a6' stroke-width='1.6'/>
<text x='950.0' y='274' text-anchor='middle' font-size='15' font-weight='bold' fill='#1f2933'>Real arm</text>
<text x='950.0' y='296' text-anchor='middle' font-size='12' fill='#1f2933' font-family='Helvetica, Arial, sans-serif'>high-level velocity</text>
<text x='950.0' y='313' text-anchor='middle' font-size='12' fill='#1f2933' font-family='Helvetica, Arial, sans-serif'>command over the</text>
<text x='950.0' y='330' text-anchor='middle' font-size='12' fill='#1f2933' font-family='Helvetica, Arial, sans-serif'>slow link</text>
<path d='M910 160 L910 200 L680 200 L680 228' fill='none' stroke='#1f2933' stroke-width='1.6' marker-end='url(#a)'/>
<text x='795' y='194' text-anchor='middle' font-size='11' fill='#8a94a6'>corrected targets (or terminal_overshoot inside the relay)</text>
<text x='590.0' y='406' text-anchor='middle' font-size='12' fill='#8a94a6'>Top: measure once, fit once, write a model only when its controls pass.  Bottom: the live path, gated before it can move metal.</text>
</svg>