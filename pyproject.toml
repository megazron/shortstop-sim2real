[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "shortstop-sim2real"
version = "0.1.0"
description = "Measure, model and close the joint-space sim-to-real gap of a position-tracked arm driven over a slow link."
readme = "README.md"
license = {text = "MIT"}
authors = [{name = "Gaus Mohiuddin Sayyad"}]
requires-python = ">=3.10"
dependencies = ["numpy>=1.22"]
keywords = ["robotics", "sim-to-real", "teleoperation", "kinova", "ros2", "calibration"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Topic :: Scientific/Engineering",
]

[project.urls]
Homepage = "https://github.com/megazron/shortstop-sim2real"

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
sim2real-gap = "sim2real_gap.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
